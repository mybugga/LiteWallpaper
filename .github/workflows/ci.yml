name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.bat

      # Nothing that identifies the build machine or a person (user names, profile paths, .pdb paths).
      - name: Check binary for personal strings
        shell: pwsh
        run: ./scripts/check-binary.ps1 LiteWallpaper.exe

      - uses: actions/upload-artifact@v4
        with:
          name: LiteWallpaper-dev
          path: LiteWallpaper.exe

  # The Android app as a debug "dev" build (those never offer updates), to catch build breaks.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
