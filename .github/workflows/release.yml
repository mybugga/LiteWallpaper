name: Release

# Push a tag like v1.2.3 to build LiteWallpaper for Windows and Android and publish both as a GitHub
# release. Running copies pick the new release up through their built-in updaters.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.3); creates the tag v<version>'
        required: true

permissions:
  contents: write

jobs:
  # LiteWallpaper-<version>.apk for Android phones, signed with the release key from the repo's secrets.
  # The phone app looks for an asset with that name to update itself.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        env:
          REF: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          v="${REF#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must look like 1.2.3, got '$v'"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || { echo "The ANDROID_KEYSTORE_* secrets are missing"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          chmod +x gradlew
          ./gradlew assembleRelease -PversionName=${{ steps.version.outputs.version }} --no-daemon
          rm "$RUNNER_TEMP/release.jks"
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/LiteWallpaper-${{ steps.version.outputs.version }}.apk

      # Updates only install over a copy signed with the same key, so never publish a debug-signed one.
      - name: Check signature
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$apksigner" verify --print-certs dist/*.apk | tee signature.txt
          grep -q "CN=LiteWallpaper" signature.txt

      # Nothing that identifies the build machine or a person. Pictures are skipped: compressed image
      # data can contain short patterns like ".pdb" by chance.
      - name: Check APK for personal strings
        run: |
          set -o pipefail
          unzip -q dist/*.apk -d apk-check
          echo "Checking $(find apk-check -type f ! -name '*.jpg' ! -name '*.png' ! -name '*.webp' | wc -l) files"
          find apk-check -type f ! -name '*.jpg' ! -name '*.png' ! -name '*.webp' -print0 |
            xargs -0 pwsh -NoProfile -File scripts/check-binary.ps1 | { grep -v " is clean$" || true; }

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk

  release:
    needs: android
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}' }
          $v = $v.TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Version must look like 1.2.3, got '$v'" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: cmd
        run: build.bat ${{ steps.version.outputs.version }}

      # Nothing that identifies the build machine or a person (user names, profile paths, .pdb paths).
      - name: Check binary for personal strings
        shell: pwsh
        run: ./scripts/check-binary.ps1 LiteWallpaper.exe

      # The updater looks for an asset named LiteWallpaper-<version>.zip with LiteWallpaper.exe at its root.
      - name: Package
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Force stage, dist | Out-Null
          Copy-Item LiteWallpaper.exe, README.md stage/
          Copy-Item shaders, particles stage/ -Recurse
          Compress-Archive -Path stage/* -DestinationPath "dist/LiteWallpaper-$v.zip"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      # LiteWallpaper-<version>-setup.exe: installs per user with Start menu shortcuts and an uninstaller.
      # Its payload is compressed, so it is not string-scanned; the exe inside was checked above.
      - name: Build installer
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q installer/LiteWallpaper.iss "/DAppVersion=$v" "/DSourceDir=$PWD\stage" "/O$PWD\dist"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: LiteWallpaper ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: dist/*
